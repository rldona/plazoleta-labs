<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plazoleta Labs · Proyecto</title>
<link rel="stylesheet" href="base.css">
<style>
  .crumbs { font: 13px var(--font-mono); color: var(--subtle); padding: 28px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
  .crumbs a:hover { color: var(--fg); }

  .head { padding: 32px 0 36px; display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: end; }
  .title { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .icon { width: 56px; height: 56px; border-radius: 14px; background: var(--fg); color: var(--accent); display: grid; place-items: center; font: 700 26px var(--font-display); flex: none; }
  h1 { font: 600 clamp(2.4rem, 6vw, 4.2rem)/1 var(--font-display); letter-spacing: -0.04em; }
  .badge { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .05em; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line-strong); color: var(--muted); }
  .badge.product { background: var(--accent); border-color: var(--accent); color: #12110f; }
  .badge.archive { border-style: dashed; }
  .tagline { font-size: 20px; color: var(--muted); max-width: 680px; margin-top: 18px; line-height: 1.45; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .chips span { font: 12.5px var(--font-mono); color: var(--subtle); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .btn { border: 1px solid var(--line-strong); border-radius: 10px; padding: 11px 18px; font-weight: 500; font-size: 15px; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--fg); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #12110f; }
  .btn.primary small { font: 12px var(--font-mono); opacity: .7; }
  @media (max-width: 800px) { .head { grid-template-columns: 1fr; gap: 20px; } .actions { justify-content: flex-start; } }

  .cover { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); }
  .cover .bar { display: flex; gap: 6px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .cover .bar i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-strong); }
  .cover img { display: block; width: 100%; height: auto; }
  .cover iframe { display: block; width: 100%; height: 620px; border: 0; background: var(--surface); }
  .poster { width: 100%; height: 420px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: 600 20px var(--font-display);
    background: repeating-linear-gradient(0deg, transparent 0 7px, color-mix(in srgb, var(--fg) 5%, transparent) 7px 8px), var(--surface); }
  .poster span { width: 72px; height: 72px; border-radius: 50%; background: var(--accent); color: #12110f; display: grid; place-items: center; font-size: 26px; transition: transform .15s; }
  .poster:hover span { transform: scale(1.08); }
  .poster small { font: 12.5px var(--font-mono); color: var(--subtle); }
  @media (max-width: 640px) { .cover iframe { height: 560px; } .poster { height: 300px; } }

  .body { display: grid; grid-template-columns: 1fr 320px; gap: 48px; margin-top: 56px; align-items: start; }
  @media (max-width: 900px) { .body { grid-template-columns: 1fr; gap: 40px; } }
  h2 { font: 600 24px var(--font-display); letter-spacing: -0.02em; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h2 a { font: 400 14px var(--font-body); color: var(--subtle); }
  h2 a:hover { color: var(--accent-ink); }
  section + section { margin-top: 56px; }

  .features { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .features div { background: var(--bg); padding: 20px; }
  .features b { font: 600 16px var(--font-display); display: block; margin-bottom: 4px; }
  .features p { font-size: 14px; color: var(--muted); }
  @media (max-width: 640px) { .features { grid-template-columns: 1fr; } }

  .releases { list-style: none; padding: 0; border-left: 1px solid var(--line-strong); margin-left: 6px; }
  .releases li { position: relative; padding: 0 0 22px 24px; }
  .releases li::before { content: ""; position: absolute; left: -5px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line-strong); }
  .releases li:first-child::before { background: var(--accent); border-color: var(--accent); }
  .releases .r-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .releases code { font: 600 15px var(--font-mono); }
  .releases .r-meta { font: 12.5px var(--font-mono); color: var(--subtle); }
  .releases p { font-size: 14.5px; color: var(--muted); margin-top: 2px; }
  .latest { font: 500 10.5px var(--font-mono); text-transform: uppercase; color: var(--accent-ink); }

  .readme { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 24px; color: var(--muted); font-size: 14.5px; }
  .readme b { color: var(--fg); }
  .notice { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 16px; font-size: 14px; color: var(--muted); margin-top: 16px; }
  .notice.archive { border-style: dashed; margin: 0 0 32px; }

  aside { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 16px; }
  @media (max-width: 900px) { aside { position: static; } }
  .box { border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .stats b { font: 600 26px/1.1 var(--font-display); display: block; }
  .stats span { font-size: 12.5px; color: var(--subtle); }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 48px; margin-top: 20px; }
  .bars i { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 2px; }
  .bars-cap { font: 11.5px var(--font-mono); color: var(--subtle); margin-top: 6px; display: flex; justify-content: space-between; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14px; }
  dt { color: var(--subtle); }
  dd { margin: 0; text-align: right; }
  dd a { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 3px; }
  .box h3 { font: 500 11.5px var(--font-mono); text-transform: uppercase; letter-spacing: .07em; color: var(--subtle); margin-bottom: 14px; }
  .contrib p { font-size: 14px; color: var(--muted); margin-bottom: 14px; }
  .contrib .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .contrib .links a { font-size: 13.5px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  .contrib .links a:hover { border-color: var(--accent); }

  .related { margin-top: 88px; border-top: 1px solid var(--line); padding-top: 40px; }
  .rel { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .rel a { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: block; }
  .rel a:hover { border-color: var(--accent); }
  .rel b { font: 600 16px var(--font-display); }
  .rel p { font-size: 13.5px; color: var(--muted); margin-top: 4px; }

  .switch { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-top: 48px; font: 12.5px var(--font-mono); color: var(--subtle); }
  .switch a { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .switch a[aria-current] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
  const CATS = window.LABS_CATS, C = window.LABS_LANG_COLOR;
  const stageLabel = { product: "Producto", experiment: "Experimento", archive: "Archivo" };
  const slug = new URLSearchParams(location.search).get("p") || "flupcode";
  const p = labsBySlug(slug) || labsBySlug("flupcode");
  const d = window.LABS_DETAIL[p.slug] || {};
  const gh = "https://github.com/" + p.repo;
  const fmt = iso => new Date(iso).toLocaleDateString("es", { day: "numeric", month: "short", year: "numeric" });
  const isGame = p.cat === "juegos" && p.site;
  document.title = `${p.name} · Plazoleta Labs`;

  const releasesTotal = p.releases || d.releases_total;
  const downloads = p.downloads || d.downloads;
  const lastRelease = p.lastRelease || d.lastRelease;

  // Botones: descarga si hay releases, juego si es jugable, web si tiene, siempre GitHub
  const actions = [
    d.download && `<a class="btn primary" href="${d.download}">↓ Descargar <small>${lastRelease}</small></a>`,
    isGame && `<a class="btn primary" href="${p.site}">▶ Jugar</a>`,
    p.site && !isGame && `<a class="btn" href="${p.site}">Web ↗</a>`,
    ...(d.extraLinks || []).map(([t, u]) => `<a class="btn" href="${u}">${t} ↗</a>`),
    `<a class="btn" href="${gh}">GitHub ↗</a>`,
  ].filter(Boolean).join("");

  const media = isGame
    ? `<div class="cover"><div class="bar"><i></i><i></i><i></i></div><button class="poster" onclick="this.outerHTML='<iframe src=&quot;${p.site}&quot; title=&quot;${p.name}&quot;></iframe>'"><span>▶</span>Jugar aquí<small>Se carga al pulsar · o ábrelo a pantalla completa con “Jugar”</small></button></div>`
    : d.cover ? `<div class="cover"><div class="bar"><i></i><i></i><i></i></div><img src="${d.cover}" alt="Captura de ${p.name}"></div>` : "";

  const stats = [
    releasesTotal && [releasesTotal, "releases"],
    downloads && [downloads.toLocaleString("es"), "descargas"],
    [labsAgo(p.updated), "última actividad"],
    d.issues !== undefined ? [d.issues, "issues abiertas"] : [p.stars, "estrellas"],
  ].filter(Boolean);

  const act = p.activity;
  const max = act ? Math.max(...act) : 0;

  const related = window.LABS.filter(x => x.cat === p.cat && x.slug !== p.slug && x.stage !== "archive").slice(0, 3);

  document.getElementById("app").innerHTML = `
    <nav class="crumbs"><a href="c-laboratorio.html">Labs</a><span>/</span><a href="c-laboratorio.html">${CATS[p.cat]}</a><span>/</span><span>${p.name}</span></nav>

    <header class="head">
      <div>
        <div class="title"><div class="icon">${p.name[0]}</div><h1>${p.name}</h1><span class="badge ${p.stage}">${stageLabel[p.stage]}</span></div>
        <p class="tagline">${d.tagline || p.desc}</p>
        <div class="chips">
          <span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${C[p.lang] || "#888"};margin-right:6px"></i>${p.lang}</span>
          ${d.stack ? `<span>${d.stack}</span>` : ""}
          ${(d.platforms || []).map(x => `<span>${x}</span>`).join("")}
          ${d.license ? `<span>${d.license}</span>` : ""}
        </div>
      </div>
      <div class="actions">${actions}</div>
    </header>

    ${p.stage === "archive" ? `<div class="notice archive">Este proyecto está archivado: ya no lo desarrollamos. Lo dejamos como referencia y el código sigue en GitHub.</div>` : ""}
    ${media}

    <div class="body">
      <div>
        ${d.features ? `<section><h2>Qué hace</h2><div class="features">${d.features.map(([t, x]) => `<div><b>${t}</b><p>${x}</p></div>`).join("")}</div></section>` : ""}

        ${d.releases ? `<section><h2>Últimas versiones <a href="${gh}/releases">Ver las ${releasesTotal} →</a></h2>
          <ol class="releases">${d.releases.map((r, i) => `<li>
            <div class="r-head"><code>${r.tag}</code>${i === 0 ? '<span class="latest">Última</span>' : ""}<span class="r-meta">${fmt(r.date)} · ${r.dl} descargas</span></div>
            <p>${r.note}</p></li>`).join("")}</ol>
          ${d.note ? `<div class="notice">${d.note}</div>` : ""}</section>` : ""}

        <section><h2>Más información <a href="${gh}#readme">Abrir en GitHub →</a></h2>
          <div class="readme"><b>Aquí va el README del repositorio, renderizado con el estilo de Labs.</b><br>
          En la versión final se descarga de GitHub al construir la web: secciones de instalación, uso y documentación, sin las insignias del principio.
          ${!window.LABS_DETAIL[p.slug] ? `<br><br>Esta ficha se ha generado solo con los datos básicos del repo (nombre, descripción, lenguaje y fecha). Así quedan los proyectos que todavía no tienen releases ni portada.` : ""}</div>
        </section>
      </div>

      <aside>
        <div class="box">
          <div class="stats">${stats.map(([n, t]) => `<div><b>${n}</b><span>${t}</span></div>`).join("")}</div>
          ${act ? `<div class="bars">${act.map(v => `<i style="height:${Math.max(4, v / max * 100)}%"></i>`).join("")}</div><div class="bars-cap"><span>commits / semana</span><span>20 sem.</span></div>` : ""}
        </div>
        <div class="box">
          <h3>Ficha</h3>
          <dl>
            <dt>Repositorio</dt><dd><a href="${gh}">${p.repo}</a></dd>
            ${p.site ? `<dt>Web</dt><dd><a href="${p.site}">${p.site.replace(/^https?:\/\//, "").replace(/\/$/, "")}</a></dd>` : ""}
            <dt>Licencia</dt><dd>${d.license || "—"}</dd>
            <dt>Lenguaje</dt><dd>${p.lang}</dd>
            ${d.since ? `<dt>Desde</dt><dd>${fmt(d.since)}</dd>` : ""}
            <dt>Actualizado</dt><dd>${fmt(p.updated)}</dd>
          </dl>
        </div>
        <div class="box contrib">
          <h3>Participa</h3>
          <p>¿Algo no funciona o echas algo en falta? Es open source: abre un issue o manda un PR.</p>
          <div class="links"><a href="${gh}/issues/new">Abrir issue</a><a href="${gh}/fork">Hacer fork</a><a href="${gh}/blob/main/LICENSE">Licencia</a></div>
        </div>
      </aside>
    </div>

    ${related.length ? `<section class="related"><h2>Más en ${CATS[p.cat]}</h2><div class="rel">${related.map(r => `
      <a href="proyecto.html?p=${r.slug}"><b>${r.name}</b><p>${r.desc}</p></a>`).join("")}</div></section>` : ""}

    <div class="switch">Probar ficha:${["flupcode", "opengit", "opennote", "flapo", "puppeteer-tor"].map(s => `<a href="proyecto.html?p=${s}" ${s === p.slug ? 'aria-current="page"' : ""}>${s}</a>`).join("")}</div>`;

  labsChrome("· Ficha de proyecto");
</script>
</body>
</html>
